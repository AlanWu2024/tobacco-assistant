<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富铖新材料 - 智能出口助手</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #0056b3 0%, #667eea 50%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #0056b3 0%, #667eea 100%);
            color: white;
            padding: 25px 35px;
            border-radius: 20px 20px 0 0;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 4px 15px rgba(0, 86, 179, 0.3);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo {
            width: 60px;
            height: 60px;
            background: white;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 900;
            color: #0056b3;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            letter-spacing: -1px;
        }

        .header-text {
            flex: 1;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 13px;
            opacity: 0.95;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 15px 20px;
            border-radius: 18px;
            line-height: 1.6;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #0056b3 0%, #667eea 100%);
            color: white;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e5e7eb;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .message-content h1,
        .message-content h2,
        .message-content h3,
        .message-content h4 {
            margin: 16px 0 12px 0;
            font-weight: 600;
            line-height: 1.4;
            color: #1f2937;
        }

        .message-content h1 { 
            font-size: 1.8em; 
            border-bottom: 2px solid #0056b3; 
            padding-bottom: 8px; 
        }
        
        .message-content h2 { 
            font-size: 1.5em; 
            border-bottom: 1px solid #e5e7eb; 
            padding-bottom: 6px; 
        }
        
        .message-content h3 { 
            font-size: 1.3em; 
            color: #0056b3;
        }
        
        .message-content h4 { 
            font-size: 1.1em; 
        }

        .message-content p {
            margin: 12px 0;
            line-height: 1.7;
        }

        .message-content ul,
        .message-content ol {
            margin: 12px 0;
            padding-left: 24px;
        }

        .message-content li {
            margin: 6px 0;
            line-height: 1.6;
        }

        .message-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 14px;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
        }

        .message-content table th {
            background: linear-gradient(135deg, #0056b3 0%, #667eea 100%);
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        .message-content table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e5e7eb;
        }

        .message-content table tr:nth-child(even) {
            background: #f9fafb;
        }

        .message-content table tr:hover {
            background: #f3f4f6;
        }

        .message-content table tr:last-child td {
            border-bottom: none;
        }

        .message-content blockquote {
            border-left: 4px solid #0056b3;
            padding: 12px 16px;
            margin: 16px 0;
            background: #f3f4f6;
            color: #4b5563;
            border-radius: 4px;
        }

        .message-content code {
            background: #f3f4f6;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            color: #dc2626;
        }

        .message-content pre {
            background: #1f2937;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 16px 0;
        }

        .message-content pre code {
            background: none;
            color: #e5e7eb;
            padding: 0;
        }

        .message-content strong {
            font-weight: 600;
            color: #1f2937;
        }

        .message-content em {
            font-style: italic;
            color: #4b5563;
        }

        .message-content a {
            color: #0056b3;
            text-decoration: none;
            border-bottom: 1px solid #0056b3;
        }

        .message-content a:hover {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .message-content hr {
            border: none;
            border-top: 2px solid #e5e7eb;
            margin: 20px 0;
        }

        .typing {
            display: none;
            padding: 15px 20px;
            background: white;
            border-radius: 18px;
            width: fit-content;
        }

        .typing.active {
            display: block;
        }

        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            margin: 0 2px;
            animation: typing 1.4s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-10px); }
        }

        .input-area {
            padding: 20px 30px;
            background: white;
            border-top: 1px solid #e5e7eb;
            border-radius: 0 0 20px 20px;
        }

        .input-wrapper {
            display: flex;
            gap: 15px;
        }

        .input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 15px;
            resize: none;
            font-family: inherit;
        }

        .input:focus {
            outline: none;
            border-color: #0056b3;
        }

        .button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #0056b3 0%, #667eea 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 86, 179, 0.4);
        }

        .button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .welcome {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

        .welcome h2 {
            font-size: 28px;
            color: #0056b3;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .welcome p {
            font-size: 16px;
            margin-bottom: 30px;
        }

        .suggestions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 12px;
            margin-top: 25px;
        }

        .suggestion {
            padding: 14px 18px;
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            text-align: left;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .suggestion:hover {
            border-color: #0056b3;
            background: linear-gradient(135deg, rgba(0, 86, 179, 0.05), rgba(102, 126, 234, 0.05));
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 86, 179, 0.15);
        }

        .error {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 14px;
        }

        .warning {
            background: #fef3c7;
            color: #92400e;
            padding: 12px 16px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 14px;
        }

        .messages::-webkit-scrollbar {
            width: 6px;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        @media (max-width: 768px) {
            .container {
                height: 100vh;
                border-radius: 0;
            }
            .header {
                border-radius: 0;
                padding: 20px;
            }
            .logo {
                width: 50px;
                height: 50px;
                font-size: 24px;
            }
            .header h1 {
                font-size: 18px;
            }
            .input-area {
                border-radius: 0;
            }
            .message-content {
                max-width: 85%;
            }
            .suggestions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <div class="logo">富铖</div>
                <div class="header-text">
                    <h1>🌏 富铖新材料 - 智能出口助手</h1>
                    <p>专业解答烟丝束出口东南亚的市场、合规、物流、金融等问题</p>
                </div>
            </div>
        </div>

        <div class="messages" id="messages">
            <div class="welcome">
                <h2>👋 欢迎使用富铖智能出口助手</h2>
                <p>我可以帮您解答关于烟丝束出口东南亚的各类问题，点击下方快捷按钮或直接输入您的问题</p>
                <div class="suggestions">
                    <div class="suggestion" onclick="ask('印尼市场的烟丝束需求情况如何？')">
                        📊 印尼市场需求分析
                    </div>
                    <div class="suggestion" onclick="ask('越南市场的烟丝束需求情况如何？')">
                        📊 越南市场需求分析
                    </div>
                    <div class="suggestion" onclick="ask('泰国市场的烟丝束需求情况如何？')">
                        📊 泰国市场需求分析
                    </div>
                    <div class="suggestion" onclick="ask('马来西亚市场的烟丝束需求情况如何？')">
                        📊 马来西亚市场需求分析
                    </div>
                    <div class="suggestion" onclick="ask('出口烟丝束需要哪些认证和资质？')">
                        📋 出口认证要求
                    </div>
                    <div class="suggestion" onclick="ask('东南亚各国的进口关税和税率是多少？')">
                        💰 关税税率查询
                    </div>
                    <div class="suggestion" onclick="ask('主要竞品企业有哪些？他们的优势是什么？')">
                        🏢 竞品企业分析
                    </div>
                    <div class="suggestion" onclick="ask('推荐的物流方案是什么？运输成本如何？')">
                        🚢 物流方案推荐
                    </div>
                    <div class="suggestion" onclick="ask('如何进行国际支付结算？有哪些风险？')">
                        💳 支付结算方案
                    </div>
                    <div class="suggestion" onclick="ask('东南亚各国的烟草政策法规是什么？')">
                        ⚖️ 政策法规解读
                    </div>
                    <div class="suggestion" onclick="ask('如何开拓东南亚市场？有什么营销建议？')">
                        🎯 市场开拓策略
                    </div>
                    <div class="suggestion" onclick="ask('烟丝束的包装和标签有什么要求？')">
                        📦 包装标签规范
                    </div>
                    <div class="suggestion" onclick="ask('如何处理出口退税？流程是什么？')">
                        🧾 出口退税指南
                    </div>
                    <div class="suggestion" onclick="ask('东南亚市场的价格区间和定价策略是什么？')">
                        💵 定价策略建议
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea 
                    class="input" 
                    id="input" 
                    placeholder="请输入您的问题..."
                    rows="1"
                ></textarea>
                <button class="button" id="send" onclick="send()">发送</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
